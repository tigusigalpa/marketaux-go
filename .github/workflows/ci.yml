name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # This module intentionally has no go.sum.

      - name: Verify no dependencies
        run: |
          go mod tidy
          test ! -f go.sum
          git diff --exit-code go.mod

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"; echo "$out"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic .

      - name: Test all packages
        run: go test -race ./...

      - name: Coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          awk '/^total:/ { found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }' coverage.txt

  quality:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  coverage:
    name: Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go test -race -coverprofile=coverage.out -covermode=atomic .
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
